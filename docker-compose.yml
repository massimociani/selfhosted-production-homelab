services:

  # ==========================================================================================
  # 1. TRAEFIK (Edge Reverse Proxy, SSL Manager & CrowdSec L7 Security for All Hosted Sites)
  # ==========================================================================================
  traefik:
    image: traefik:v3
    container_name: traefik
    environment:
      # IMPORTANT: Cloudflare API token must cover all managed zones (${DOMAIN_1}, ${DOMAIN_NK1}, ${DOMAIN_2})
      # Check provider documentation if using an alternate DNS registrar
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      # --- Timezone configuration ---
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # --- Security fix: Header anti-spoofing for Authelia ForwardAuth ---
      - "--entrypoints.web.http.aliasHeadersStrategy=reject"
      - "--entrypoints.websecure.http.aliasHeadersStrategy=reject"
      - "--entrypoints.traefik.http.aliasHeadersStrategy=reject"
      # --- HTTP/3 (QUIC) support ---
      - "--entrypoints.websecure.http3"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=${CF_TRUSTED_IPS}"
      # --- Dynamic file provider (enables Traefik CrowdSec bouncer plugin and custom configs) ---
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--providers.file.watch=true" # Automatically reloads dynamic configuration changes without restarting
      # --- Global HTTP -> HTTPS redirection ---
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.http.tls.certResolver=cloudflare"
      # --- Traefik Web Dashboard (disabled by default) ---
      #- "--api.insecure=true"
      #- "--api.dashboard=true"
      # --- Let's Encrypt configuration (DNS-01 Challenge for Wildcard certificates) ---
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=${EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delayBeforeChecks=90"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.propagation.disableChecks=true"
      # --- Certificate domain definitions ---
      # 1. ${DOMAIN_1}
      - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN_1}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN_1}"
      # 2. ${DOMAIN_NK1} (Main + Subdomain)
      - "--entrypoints.websecure.http.tls.domains[1].main=${DOMAIN_NK1}"
      - "--entrypoints.websecure.http.tls.domains[1].sans=*.${DOMAIN_NK1}"
      - "--entrypoints.websecure.http.tls.domains[2].sans=*.${MW_SUBNAME_NK1a}.${DOMAIN_NK1}"
      # 3. ${DOMAIN_2} (Nextcloud and subdomains)
      - "--entrypoints.websecure.http.tls.domains[3].main=${DOMAIN_2}"
      - "--entrypoints.websecure.http.tls.domains[3].sans=*.${DOMAIN_2}"
      # 4. ${DOMAIN_3}
      - "--entrypoints.websecure.http.tls.domains[4].main=${DOMAIN_3}"
      - "--entrypoints.websecure.http.tls.domains[4].sans=*.${DOMAIN_3}"
      # --- Enable access log (shared with CrowdSec LAPI for real-time parsing) ---
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      # --- CrowdSec bouncer Traefik plugin ---
      - "--experimental.plugins.crowdsec.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec.version=v1.8.1"
      # --- Prometheus metrics export for monitoring ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"   # Required for HTTP/3 (QUIC)
      #- "8080:8080"  # Enable only if exposing the Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # --- Persistent storage for Let's Encrypt certificates ---
      - "./traefik/acme.json:/letsencrypt/acme.json"
      # --- Sync timezone with host ---
      - /etc/localtime:/etc/localtime:ro
      # --- Mount shared access log directory for CrowdSec parsing ---
      - ./traefik/logs:/var/log/traefik
      # --- Mount dynamic configuration for CrowdSec middleware ---
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}2
      sdr_net:
        ipv4_address: ${NET_SDR_NET}2
    restart: always
    depends_on:
      crowdsec:
        condition: service_healthy

  # ==========================================
  # 2. SECURITY (CrowdSec Threat Intelligence Engine)
  # ==========================================
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    environment:
      - TZ=${TZ}
      - GID=1000
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd crowdsecurity/nginx LePresidente/grafana crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/wordpress crowdsecurity/nextcloud crowdsecurity/apache2 crowdsecurity/whitelist-good-actors LePresidente/authelia
      - DISABLE_SCENARIOS=crowdsecurity/http-crawl-non_statics
      # Metrics export for Prometheus / VictoriaMetrics
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_LISTEN_PORT=6060
    volumes:
      - ./crowdsec/db:/var/lib/crowdsec/data
      - ./crowdsec/config:/etc/crowdsec
      # --- Host SSH auth logs ---
      - /var/log/auth.log:/var/log/auth.log:ro
      # --- Traefik access logs for L7 threat detection ---
      - ./traefik/logs/access.log:/var/log/traefik/access.log:ro
      # --- Sync timezone with host ---
      - /etc/localtime:/etc/localtime:ro
      # --- Docker socket access to parse logs from isolated containers (e.g., dmz_rsync via acquis.yaml) ---
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # --- Mount Nextcloud log for dedicated CrowdSec collection parsing ---
      - ${BACKUP_02}/nc_data/nextcloud.log:/var/log/nextcloud.log:ro
    ports:
      - "127.0.0.1:8081:8080"  # Expose LAPI locally on port 8081 for the host firewall bouncer
    healthcheck:
      test:
        - CMD
        - cscli
        - lapi
        - status
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 30s
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}3

    restart: always

  # ==========================================
  # 2a. AUTHENTICATION (Authelia SSO & 2FA)
  # ==========================================
  authelia:
    image: authelia/authelia:latest
    #profiles: ["disable"] # Uncomment to disable service
    container_name: authelia
    volumes:
      - ./appdata/authelia:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}4
    restart: always
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      # Authelia portal login router
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN_2}`) || Host(`auth.${DOMAIN_1}`) || Host(`auth.${DOMAIN_NK1}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls.certresolver=cloudflare"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      # --- MIDDLEWARE 1: Administrative portals (${DOMAIN_2}) ---
      # Redirect unauthorized requests to auth.${DOMAIN_2}
      - "traefik.http.middlewares.authelia-${MW_NAME_2}.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.${DOMAIN_2}/"
      - "traefik.http.middlewares.authelia-${MW_NAME_2}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-${MW_NAME_2}.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.middlewares.authelia-${MW_NAME_2}.forwardauth.maxResponseBodySize=10240"
      - "traefik.http.routers.authelia-${MW_NAME_2}.middlewares=crowdsec-check@file"
      # --- MIDDLEWARE 2: Production web services (${DOMAIN_1}) ---
      # Redirect unauthorized requests to auth.${DOMAIN_1}
      - "traefik.http.middlewares.authelia-${MW_NAME_1}.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.${DOMAIN_1}/"
      - "traefik.http.middlewares.authelia-${MW_NAME_1}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-${MW_NAME_1}.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.middlewares.authelia-${MW_NAME_1}.forwardauth.maxResponseBodySize=10240"
      - "traefik.http.routers.authelia-${MW_NAME_1}.middlewares=crowdsec-check@file"
      # --- MIDDLEWARE 3: Secondary services (${DOMAIN_NK1}) ---
      # Redirect unauthorized requests to auth.${DOMAIN_NK1}
      - "traefik.http.middlewares.authelia-${MW_NAME_NK1a}_org.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.${DOMAIN_NK1}/"
      - "traefik.http.middlewares.authelia-${MW_NAME_NK1a}_org.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-${MW_NAME_NK1a}_org.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      - "traefik.http.middlewares.authelia-${MW_NAME_NK1a}_org.forwardauth.maxResponseBodySize=10240"
      - "traefik.http.routers.authelia-${MW_NAME_NK1a}_org.middlewares=crowdsec-check@file"

  # ==========================================
  # 3. SHARED INFRASTRUCTURE (DB & In-Memory Cache)
  # ==========================================
  db:
    image: mariadb:12.3
    container_name: mariadb_shared
    command: >
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
      --innodb-buffer-pool-size=2G
      --log-bin-trust-function-creators=1
      --innodb-use-native-aio=0
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
      --max-allowed-packet=128M
      --wait_timeout=28800
      --innodb-log-file-size=256M
      --slow_query_log=1
      --long_query_time=2
      --tmp_table_size=64M
      --max_heap_table_size=64M
    volumes:
      - ./appdata/mariadb:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}10
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_shared
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}

    # --- Redis In-Memory Cache Tuning ---
    # --maxmemory 512mb: Cap RAM at 512MB (sufficient for 3 WordPress sites + Nextcloud)
    # --maxmemory-policy allkeys-lru: Evict least recently used keys when memory limit is reached
    # --save "": Disable disk snapshots (RDB) to eliminate unnecessary NVMe I/O wear
    # --appendonly no: Disable Append-Only File persistence
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}11
    restart: always

  # ==========================================
  # 4. NEXTCLOUD (Pure Docker: FPM + Nginx)
  # ==========================================
  nextcloud_app:
    image: custom-nextcloud:fpm-full
    build: ./docker_build/nextcloud
    #profiles: ["disable"] # Uncomment to disable service
    container_name: nextcloud_app
    extra_hosts:
      - "cloud.${DOMAIN_2}:${NET_WEB_NET}2"
      - "${DOMAIN_2}:${NET_WEB_NET}2"
      - "cloud.${DOMAIN_NK1}:${NET_WEB_NET}2"
      - "office.${DOMAIN_2}:${NET_WEB_NET}2"
      - "talk.${DOMAIN_2}:${NET_WEB_NET}2"
    volumes:
      # 1. User data stored on SATA HDD
      - ${BACKUP_02}/nc_data:/var/www/html/data
      # 2. Core configuration stored on NVMe SSD
      - ./appdata/web/nextcloud/config:/var/www/html/config
      # 3. Persistent custom apps on NVMe SSD
      - ./appdata/web/nextcloud/custom_apps:/var/www/html/custom_apps
      # 4. Persistent custom themes on NVMe SSD
      - ./appdata/web/nextcloud/themes:/var/www/html/themes
      # 5. Timezone synchronization
      - /etc/localtime:/etc/localtime:ro
      # Nextcloud external storage mounts (read-only)
      - ${BACKUP_01}/archives/media/photos:/mnt/ext_backup_01/archives/media/photos:ro
      - ${DISK_01}/musica:/mnt/ext_nc-music-edit/musica:ro
      # PHP runtime configurations
      - ./appdata/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./appdata/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      # Custom PHP-FPM pool configuration override
      - ./appdata/php/www.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      # Mount host fonts read-only for document rendering
      - /usr/share/fonts:/usr/share/fonts:ro
    environment:
      - TZ=${TZ}
      - NC_serverid=1
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      # Trusted domains (space-separated)
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN_2} cloud.${DOMAIN_2} cloud.${DOMAIN_NK1}
      # Intel integrated GPU driver for hardware acceleration
      - LIBVA_DRIVER_NAME=iHD
      # --- PHP-FPM process pool tuning (reference values for 8GB host RAM) ---
      #- PM_MAX_CHILDREN=25        # Max 25 concurrent requests
      #- PM_START_SERVERS=5        # Start with 5 spare child processes
      #- PM_MIN_SPARE_SERVERS=5    # Minimum spare child processes
      #- PM_MAX_SPARE_SERVERS=10   # Max idle processes to conserve RAM
      #- PM_MAX_REQUESTS=1000      # Respawn worker after 1000 requests to prevent leaks
      # ------------------------------
    labels:
      # Exclude custom-built local image from Diun update polling
      - "diun.enable=false"
    devices:
      # Intel iGPU device passthrough
      - /dev/dri:/dev/dri
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - MKNOD
    security_opt:
      - apparmor:unconfined
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}20
    restart: always
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      coturn:
        condition: service_started


  nextcloud_nginx:
    image: nginx:latest
    #profiles: ["disable"] # Uncomment to disable service
    container_name: nextcloud_nginx
    extra_hosts:
      - "cloud.${DOMAIN_2}:${NET_WEB_NET}2"
      - "${DOMAIN_2}:${NET_WEB_NET}2"
      - "cloud.${DOMAIN_NK1}:${NET_WEB_NET}2"
      - "office.${DOMAIN_2}:${NET_WEB_NET}2"
    environment:
      - TZ=${TZ}
    volumes_from:
      - nextcloud_app # Inherit app volumes for static assets
    volumes:
      # Dedicated Nextcloud Nginx configuration
      - ./web/nginx_conf/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
      # Enforce read-only mounts on Nginx frontend for defense-in-depth
      # Override inherited volumes to read-only (:ro)
      - ${BACKUP_02}/nc_data:/var/www/html/data:ro
      - ./appdata/web/nextcloud/config:/var/www/html/config:ro
      - ./appdata/web/nextcloud/custom_apps:/var/www/html/custom_apps:ro
      - ./appdata/web/nextcloud/themes:/var/www/html/themes:ro
      # Timezone synchronization
      - /etc/localtime:/etc/localtime:ro
    links:
      - nextcloud_app
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}21
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nc.rule=Host(`cloud.${DOMAIN_2}`) || Host(`${DOMAIN_2}`) || Host(`cloud.${DOMAIN_NK1}`)"
      - "traefik.http.routers.nc.entrypoints=websecure"
      - "traefik.http.routers.nc.tls.certresolver=cloudflare"
      # Enforce HSTS security headers
      - "traefik.http.middlewares.nc-header.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.nc-header.headers.forceSTSHeader=true"
      - "traefik.http.routers.nc.middlewares=nc-header,crowdsec-check@file"
    depends_on:
      nextcloud_app:
        condition: service_started

  # ==========================================
  # 4a. COLLABORA ONLINE (Dedicated Document Server)
  # ==========================================
  collabora:
    image: collabora/code:latest
    container_name: collabora
    extra_hosts:
      - "${DOMAIN_2}:${NET_WEB_NET}2"
      - "cloud.${DOMAIN_2}:${NET_WEB_NET}2"
      - "cloud.${DOMAIN_NK1}:${NET_WEB_NET}2"
    environment:
      - TZ=${TZ}
      # 1. DOMAIN ALLOWLIST: Nextcloud instances authorized to connect (comma-separated)
      - aliasgroup1=https://cloud.${DOMAIN_2}:443,https://${DOMAIN_2}:443,https://cloud.${DOMAIN_NK1}:443
      - server_name=office.${DOMAIN_2}
      # 2. SSL TERMINATION: Delegate TLS termination to Traefik
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      # Default dictionaries
      - Dictionaries=it_IT,en_US
    cap_add:
      - MKNOD
      - SYS_ADMIN
    # Required capability for Collabora internal chroot mounts
    security_opt:
      - seccomp:unconfined
    volumes:
      - /usr/share/fonts:/opt/collaboraoffice/share/fonts/truetype/custom:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}40
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`office.${DOMAIN_2}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.routers.collabora.tls.certresolver=cloudflare"
      # Note: Authelia ForwardAuth must NOT be enabled here; Nextcloud connects via WOPI tokens.
      - "traefik.http.routers.collabora.middlewares=crowdsec-check@file"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"

  # ==========================================
  # 4b. NEXTCLOUD WHITEBOARD (WebSocket Server for Excalidraw)
  # ==========================================
  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:stable
    container_name: whiteboard
    environment:
      - TZ=${TZ}
      # Primary Nextcloud domain
      - NEXTCLOUD_URL=https://${DOMAIN_2}
      # Internal JWT shared secret
      - JWT_SECRET_KEY=${JWT_SECRET_KEY_WHITEBOARD}
      - MAX_UPLOAD_FILE_SIZE=20971520
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}34
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whiteboard.rule=Host(`whiteboard.${DOMAIN_2}`)"
      - "traefik.http.routers.whiteboard.entrypoints=websecure"
      - "traefik.http.routers.whiteboard.tls.certresolver=cloudflare"
      - "traefik.http.services.whiteboard.loadbalancer.server.port=3002"
      # CrowdSec bouncer protection
      # Note: Authelia omitted; authentication handled via internal JWT tokens.
      - "traefik.http.routers.whiteboard.middlewares=crowdsec-check@file"

  # ==========================================
  # 4c. COTURN (STUN/TURN Server for Video Calls)
  # ==========================================
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: always
    network_mode: host  # Required: run in host network mode for direct UDP traversal
    volumes:
      # Logs
      - ./coturn/logs:/var/log
      # Timezone
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DETECT_EXTERNAL_IP=turn.${DOMAIN_2}
      - DETECT_RELAY_IP=yes
      # Secret auth key
      - STATIC_AUTH_SECRET=${STATIC_AUTH_SECRET_COTURN}
      - TZ=${TZ}
      - prometheus
    command:
      - --log-file=/var/log/turn.log
      - --verbose
      #- --syslog
      #- --log-file-level=INFO
      - --use-auth-secret
      #- --no-cli
      - --external-ip=turn.${DOMAIN_2} # Discovers public IP automatically
      - --realm=turn.${DOMAIN_2}
      #- --listening-ip=0.0.0.0
      - --listening-port=${COTURN_PORT1}
      - --min-port=${COTURN_PORT2}      # Relay port range start
      - --max-port=${COTURN_PORT3}      # Relay port range end (restricted to 200 ports for security)
      - --fingerprint
      - --static-auth-secret=${STATIC_AUTH_SECRET_COTURN}
      - --pidfile=/var/tmp/turnserver.pid
      # Disable plain TLS to keep logs clean (WebRTC handles end-to-end DTLS)
      - --no-tls
      #- --no-dtls
      # Prometheus metrics
      - --prometheus
      - --prometheus-port=9641
      - --prometheus-path=/metrics

  # ==========================================
  # 4d. AI CHAT INTERFACE (Open WebUI - ChatGPT Style)
  # ==========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: always
    environment:
      - TZ=${TZ}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY_OWEBUI}
      # Connect to external OpenRouter API endpoint
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      # Leave empty here; API key is configured securely inside the UI settings
      - OPENAI_API_KEY=
      # Disable public registrations after initial admin account creation
      - ENABLE_SIGNUP=false
      # Disable local Ollama endpoints (cloud inference only)
      - ENABLE_OLLAMA_API=false
      - CORS_ALLOW_ORIGIN=https://chat.${DOMAIN_2}
      #- ENABLE_KB_EXEC=true
    volumes:
      - ./appdata/open-webui:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}51
    labels:
      - "traefik.enable=true"
      # Subdomain routing
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN_2}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=cloudflare"
      # Open WebUI internal port
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
      # Protected by CrowdSec bouncer and Authelia 2FA
      - "traefik.http.routers.openwebui.middlewares=crowdsec-check@file,authelia-${MW_NAME_2}"

  # ==========================================
  # 5. SITO WP 1: ${DOMAIN_1} (www -> non-www)
  # ==========================================
  ${MW_NAME_1a}_php:
    # Path to custom Dockerfile
    build: ./docker_build/wordpress
    # Tag for local custom image caching
    image: custom-wordpress:php8.3-redis
    container_name: ${MW_NAME_1a}_php
    extra_hosts:
      - "${DOMAIN_1}:${NET_WEB_NET}2"
      - "www.${DOMAIN_1}:${NET_WEB_NET}2"
    volumes:
      # Persistent site content (plugins, themes, uploads)
      - ./appdata/web/${DOMAIN_1}/wp-content:/var/www/html/wp-content
      # Dedicated wp-config.php on SSD
      - ./appdata/web/${DOMAIN_1}/wp-config.php:/var/www/html/wp-config.php
      - ./appdata/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - /etc/localtime:/etc/localtime:ro
      # PHP OPcache
      - ./appdata/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      # --- Site-specific FPM pool override ---
      # Allocates custom worker pool limit
      - ./appdata/php/wp-pool.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      # ------------------------------------------
    environment:
      # Database credentials managed in wp-config.php
      - TZ=${TZ}
      - WORDPRESS_DB_HOST=db
    labels:
      # Exclude custom-built image from Diun update polling
      - "diun.enable=false"
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}22
    restart: always
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

  ${MW_NAME_1a}_nginx:
    image: nginx:latest
    container_name: ${MW_NAME_1a}_nginx
    environment:
      - TZ=${TZ}
    volumes_from:
      - ${MW_NAME_1a}_php
    volumes:
      # Generic Nginx config for WordPress + W3 Total Cache
      - ./web/nginx_conf/wordpress-w3tcache.conf:/etc/nginx/conf.d/default.conf:ro
      - ./appdata/web/${DOMAIN_1}/wp-content:/var/www/html/wp-content:ro
      - /etc/localtime:/etc/localtime:ro
    links:
      - ${MW_NAME_1a}_php:php
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}23
    restart: always
    labels:
      - "traefik.enable=true"
      # --- 1. Internal Traefik service definition ---
      # Internal load balancer routing on port 80
      - "traefik.http.services.${MW_NAME_1a}-svc.loadbalancer.server.port=80"
      # Handle both root domain and www subdomain
      - "traefik.http.routers.${MW_NAME_1a}.rule=Host(`${DOMAIN_1}`) || Host(`www.${DOMAIN_1}`)"
      - "traefik.http.routers.${MW_NAME_1a}.entrypoints=websecure"
      - "traefik.http.routers.${MW_NAME_1a}.tls.certresolver=cloudflare"
      # Middleware: Canonical www -> non-www 301 redirect
      - "traefik.http.middlewares.${MW_NAME_1a}-redirect.redirectregex.regex=^https?://www.${DOMAIN_1}/(.*)"
      - "traefik.http.middlewares.${MW_NAME_1a}-redirect.redirectregex.replacement=https://${DOMAIN_1}/$${1}"
      - "traefik.http.middlewares.${MW_NAME_1a}-redirect.redirectregex.permanent=true"
      # --- Middleware: Root localization redirect ---
      # Regex matches exact trailing /en or /en/
      - "traefik.http.middlewares.${MW_NAME_1a}-en-strip.redirectregex.regex=^https://${DOMAIN_1}/en/*$$"
      - "traefik.http.middlewares.${MW_NAME_1a}-en-strip.redirectregex.replacement=https://${DOMAIN_1}/"
      - "traefik.http.middlewares.${MW_NAME_1a}-en-strip.redirectregex.permanent=true"
      - "traefik.http.routers.${MW_NAME_1a}.middlewares=${MW_NAME_1a}-redirect,${MW_NAME_1a}-en-strip,crowdsec-check@file"
      # Link router to internal service
      - "traefik.http.routers.${MW_NAME_1a}.service=${MW_NAME_1a}-svc"
      # --- 2. Administrative protected router (Authelia 2FA) ---
      # Matches login and admin paths with higher specificity
      # Evaluates with precedence over public router
      # Matches /wp-login.php and /wp-admin while allowing /wp-admin/admin-ajax.php through
      - "traefik.http.routers.${MW_NAME_1a}-secure.rule=(Host(`${DOMAIN_1}`) || Host(`www.${DOMAIN_1}`)) && (Path(`/wp-login.php`) || (PathPrefix(`/wp-admin`) && !PathPrefix(`/wp-admin/admin-ajax.php`)))"
      - "traefik.http.routers.${MW_NAME_1a}-secure.entrypoints=websecure"
      - "traefik.http.routers.${MW_NAME_1a}-secure.tls.certresolver=cloudflare"
      # Enforces Authelia 2FA on administrative access
      - "traefik.http.routers.${MW_NAME_1a}-secure.middlewares=${MW_NAME_1a}-redirect,crowdsec-check@file,authelia-${MW_NAME_1}"
      # Connect protected router to same internal service
      - "traefik.http.routers.${MW_NAME_1a}-secure.service=${MW_NAME_1a}-svc"
    depends_on:
      ${MW_NAME_1a}_php:
        condition: service_started

  # ==========================================
  # 5a. SITO IT / SYSADMIN STATICO: ${DOMAIN_3}
  # ==========================================
  domain3_it_web:
    image: nginx:alpine
    container_name: domain3_it_web
    restart: always
    volumes:
      - ./appdata/web/${DOMAIN_3}:/usr/share/nginx/html:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}36
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${MW_NAME_3}.rule=Host(`${DOMAIN_3}`) || Host(`www.${DOMAIN_3}`)"
      - "traefik.http.routers.${MW_NAME_3}.entrypoints=websecure"
      - "traefik.http.routers.${MW_NAME_3}.tls.certresolver=cloudflare"
      - "traefik.http.middlewares.${MW_NAME_3}-redirect.redirectregex.regex=^https?://www.${DOMAIN_3}/(.*)"
      - "traefik.http.middlewares.${MW_NAME_3}-redirect.redirectregex.replacement=https://${DOMAIN_3}/$${1}"
      - "traefik.http.middlewares.${MW_NAME_3}-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.${MW_NAME_3}.middlewares=${MW_NAME_3}-redirect,crowdsec-check@file"
      - "traefik.http.services.${MW_NAME_3}.loadbalancer.server.port=80"

  # ==========================================
  # 6. SITO WP 2: ${DOMAIN_NK1} (non-www -> www)
  # ==========================================
  ${MW_NAME_NK1a}_main_php:
