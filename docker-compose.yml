      - ./appdata/web/${DOMAIN_NK1}/wp-content:/var/www/html/wp-content:ro
      - /etc/localtime:/etc/localtime:ro
    links:
      - ${MW_NAME_NK1a}_main_php:php
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}25
    restart: always
    labels:
      - "traefik.enable=true"
      # Define internal service on port 80
      - "traefik.http.services.${MW_NAME_NK1a}-svc.loadbalancer.server.port=80"
      # ---------------------
      - "traefik.http.routers.${MW_NAME_NK1a}.rule=Host(`${DOMAIN_NK1}`) || Host(`www.${DOMAIN_NK1}`)"
      - "traefik.http.routers.${MW_NAME_NK1a}.entrypoints=websecure"
      - "traefik.http.routers.${MW_NAME_NK1a}.tls.certresolver=cloudflare"
      # Middleware: Canonical non-www -> www 301 redirect
      - "traefik.http.middlewares.${MW_NAME_NK1a}-redirect.redirectregex.regex=^https?://${DOMAIN_NK1}/(.*)"
      - "traefik.http.middlewares.${MW_NAME_NK1a}-redirect.redirectregex.replacement=https://www.${DOMAIN_NK1}/$${1}"
      - "traefik.http.middlewares.${MW_NAME_NK1a}-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.${MW_NAME_NK1a}.middlewares=${MW_NAME_NK1a}-redirect,crowdsec-check@file"
      - "traefik.http.routers.${MW_NAME_NK1a}.service=${MW_NAME_NK1a}-svc"
      # --- 2. Administrative protected router (Authelia 2FA) ---
      # Matches login and admin paths with higher specificity
      # Evaluates with precedence over public router
      # Matches /wp-login.php and /wp-admin while allowing /wp-admin/admin-ajax.php through
      - "traefik.http.routers.${MW_NAME_NK1a}-secure.rule=(Host(`${DOMAIN_NK1}`) || Host(`www.${DOMAIN_NK1}`)) && (Path(`/wp-login.php`) || (PathPrefix(`/wp-admin`) && !PathPrefix(`/wp-admin/admin-ajax.php`)))"
      - "traefik.http.routers.${MW_NAME_NK1a}-secure.entrypoints=websecure"
      - "traefik.http.routers.${MW_NAME_NK1a}-secure.tls.certresolver=cloudflare"
      # Enforces Authelia 2FA on admin paths
      - "traefik.http.routers.${MW_NAME_NK1a}-secure.middlewares=${MW_NAME_NK1a}-redirect,crowdsec-check@file,authelia-${MW_NAME_NK1a}_org"
      # Link router to internal service
      - "traefik.http.routers.${MW_NAME_NK1a}-secure.service=${MW_NAME_NK1a}-svc"
    depends_on:
      ${MW_NAME_NK1a}_main_php:
        condition: service_started

  # ==========================================
  # 7. SITO WP 3: ${MW_SUBNAME_NK1a} (www -> non-www)
  # ==========================================
  ${MW_SUBNAME_NK1a}_php:
    image: wordpress:7-php8.3-fpm
#    profiles: ["disable"] # Uncomment to disable service
    container_name: ${MW_SUBNAME_NK1a}_php
    extra_hosts:
