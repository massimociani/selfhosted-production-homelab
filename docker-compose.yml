      - WORDPRESS_DB_HOST=db
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}26
    restart: always
    depends_on:
      db:
        condition: service_started

  ${MW_SUBNAME_NK1a}_nginx:
    image: nginx:latest
#    profiles: ["disable"] # Uncomment to disable service
    container_name: ${MW_SUBNAME_NK1a}_nginx
    environment:
      - TZ=${TZ}
    volumes_from:
      - ${MW_SUBNAME_NK1a}_php
    volumes:
      - ./web/nginx_conf/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./appdata/web/${MW_SUBNAME_NK1a}.${DOMAIN_NK1}/wp-content:/var/www/html/wp-content:ro
      - /etc/localtime:/etc/localtime:ro
    links:
      - ${MW_SUBNAME_NK1a}_php:php
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}27
    restart: always
    labels:
      - "traefik.enable=true"
      # Define internal service on port 80
      - "traefik.http.services.${MW_SUBNAME_NK1a}-svc.loadbalancer.server.port=80"
      # ---------------------------
      - "traefik.http.routers.${MW_SUBNAME_NK1a}.rule=Host(`${MW_SUBNAME_NK1a}.${DOMAIN_NK1}`) || Host(`www.${MW_SUBNAME_NK1a}.${DOMAIN_NK1}`)"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}.entrypoints=websecure"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}.tls.certresolver=cloudflare"
      # Middleware: Canonical www -> non-www 301 redirect
      #- "traefik.http.routers.${MW_SUBNAME_NK1a}.middlewares=${MW_SUBNAME_NK1a}-redirect"
      - "traefik.http.middlewares.${MW_SUBNAME_NK1a}-redirect.redirectregex.regex=^https?://www.${MW_SUBNAME_NK1a}.${DOMAIN_NK1}/(.*)"
      - "traefik.http.middlewares.${MW_SUBNAME_NK1a}-redirect.redirectregex.replacement=https://${MW_SUBNAME_NK1a}.${DOMAIN_NK1}/$${1}"
      - "traefik.http.middlewares.${MW_SUBNAME_NK1a}-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}.middlewares=${MW_SUBNAME_NK1a}-redirect,crowdsec-check@file"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}.service=${MW_SUBNAME_NK1a}-svc"
      # --- 2. Administrative protected router (Authelia 2FA) ---
      # Matches login and admin paths with higher specificity
      # Evaluates with precedence over public router
      # Matches /wp-login.php and /wp-admin while allowing /wp-admin/admin-ajax.php through
      - "traefik.http.routers.${MW_SUBNAME_NK1a}-secure.rule=(Host(`${MW_SUBNAME_NK1a}.${DOMAIN_NK1}`) || Host(`www.${MW_SUBNAME_NK1a}.${DOMAIN_NK1}`)) && (Path(`/wp-login.php`) || (PathPrefix(`/wp-admin`) && !PathPrefix(`/wp-admin/admin-ajax.php`)))"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}-secure.entrypoints=websecure"
      - "traefik.http.routers.${MW_SUBNAME_NK1a}-secure.tls.certresolver=cloudflare"
      # Enforces Authelia 2FA on admin paths
      - "traefik.http.routers.${MW_SUBNAME_NK1a}-secure.middlewares=${MW_SUBNAME_NK1a}-redirect,crowdsec-check@file,authelia-${MW_NAME_NK1a}_org"
      # Link router to internal service
      - "traefik.http.routers.${MW_SUBNAME_NK1a}-secure.service=${MW_SUBNAME_NK1a}-svc"
    depends_on:
      ${MW_SUBNAME_NK1a}_php:
        condition: service_started

  # ==========================================
  # 8. BACKUP SYSTEM (Backrest / Restic Backup Orchestrator)
  # ==========================================
  backrest:
    # image: garethgeorge/backrest:latest
    build: ./docker_build/backrest       # Custom build adding MariaDB client tools for pre-backup dumps
    image: custom-backrest:with-tools
    container_name: backrest
    restart: always
    environment:
      - TZ=${TZ}
      - BACKREST_DATA=/app/data
      - BACKREST_CONFIG=/app/config/config.json
      - XDG_CACHE_HOME=/app/cache
      - GOGC=50
    volumes:
      # Backup sources (mounted read-only for safety)
      - ${BACKUP_02}:${BACKUP_02}:ro
      - ${HOMELAB_DIR}:/source/homelab:ro
      - /etc:/source/etc:ro
      # Mount dump target read-write for SQL pre-backup scripts
      - ${HOMELAB_DIR}/db_dumps:/db_dumps:rw
      # Backup repository destination
      - ${BACKUP_01}:/repo

      # Backrest persistent configurations and cache
      - ./appdata/backrest/data:/app/data
      - ./appdata/backrest/config:/app/config
      - ./appdata/backrest/cache:/app/cache

      # --- Custom automation hooks ---
      # 1. Pre/post backup hook scripts
      - ./appdata/backrest/scripts:/scripts
      # 2. Docker socket (allows Backrest hooks to interact with containers)
      - /var/run/docker.sock:/var/run/docker.sock
      # -----------------------------
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "diun.enable=false" # Exclude custom build from Diun update polling
    ports:
      - "9898:9898"
    depends_on:
      db:
        condition: service_started
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}12

  # ==========================================
  # 8a. CONTAINER MANAGEMENT (Portainer)
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    #profiles: ["disable"] # Uncomment to disable service
    container_name: portainer
    extra_hosts:
      - "docker.${DOMAIN_2}:${NET_WEB_NET}2"
    environment:
      - TZ=${TZ}
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket management
      - ./appdata/portainer:/data                    # Persistent data directory
      - /etc/localtime:/etc/localtime:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}28
    labels:
      - "traefik.enable=true"
      # Domain routing
      - "traefik.http.routers.portainer.rule=Host(`docker.${DOMAIN_2}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      # Authentication middleware
      # Remove the lines below to use Portainer's internal native login instead:
      # - "traefik.http.routers.portainer.middlewares=auth"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.middlewares=crowdsec-check@file,authelia-${MW_NAME_2}"
      # - "traefik.http.middlewares.lan-only.ipallowlist.sourcerange=127.0.0.1/32,${NET_LOCAL}0/24,${NET_WEB_NET}0/16"
      # - "traefik.http.routers.portainer.middlewares=lan-only@docker"

  # ==========================================
  # 8b. MONITORING STACK
  # ==========================================

  # Metrics Storage (VictoriaMetrics)
  prometheus: # Kept container name 'prometheus' for seamless Grafana datasource compatibility
    image: victoriametrics/victoria-metrics:latest
    #profiles: ["disable"] # Uncomment to enable
    container_name: prometheus
    environment:
      - TZ=${TZ}
    volumes:
      - ./appdata/prometheus/data:/victoria-metrics-data
      - ./appdata/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--retentionPeriod=1y" # VictoriaMetrics high-compression storage allows 1-year retention with minimal disk impact
      - "--enableTCP6"
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}29
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    environment:
      - TZ=${TZ}
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}32
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    environment:
      - TZ=${TZ}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/kmsg
    command:
      # Monitor Docker containers only (ignore host system processes)
      - '--docker_only=true'
      # Throttle internal metrics sampling to 15s interval
      # Matches Prometheus scraping frequency to conserve CPU resources
      - '--housekeeping_interval=15s'
      # Disable heavy metric collectors that cause high CPU/RAM overhead
      # disk: Per-container disk usage calculation is resource-intensive
      # diskIO: Skip per-container I/O statistics
      # tcp/udp/advtcp: Exclude advanced networking telemetry
      # percpu: Total CPU metrics are sufficient; skip per-core telemetry
      # sched/process: Kernel scheduling stats omitted
      - '--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,advtcp,referenced_memory'
      # Skip metric collection for stopped containers
      - '--store_container_labels=false'
    privileged: true # Privileged mode required for cgroup v2 metrics access on modern Linux kernels
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}33
    restart: always

  # Metrics Visualization (Grafana)
  grafana:
    image: grafana/grafana:latest
    #profiles: ["disable"] # Uncomment to enable
    container_name: grafana
    environment:
      - TZ=${TZ}
    extra_hosts:
      - "monitor.${DOMAIN_2}:${NET_WEB_NET}2"
    volumes:
      - ./appdata/grafana:/var/lib/grafana # Persistent dashboards and user data
      - /etc/localtime:/etc/localtime:ro
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}30
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.${DOMAIN_2}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      # Security: CrowdSec bouncer and Authelia 2FA
      - "traefik.http.routers.grafana.middlewares=crowdsec-check@file,authelia-${MW_NAME_2}"
      # Toggle below for LAN-only restriction if needed
      #- "traefik.http.middlewares.lan-only.ipallowlist.sourcerange=127.0.0.1/32,${NET_LOCAL}0/24,${NET_WEB_NET}0/16"
      #- "traefik.http.routers.grafana.middlewares=lan-only@docker"
      # Explicit internal port definition
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      prometheus:
        condition: service_started

  # ==========================================
  # 8c. RSYNC (Isolated / DMZ Target) - Panubo (Quay.io)
  # ==========================================
  dmz_rsync:
    # Upstream SSH/rsync server image
    image: quay.io/panubo/sshd:latest
    container_name: dmz_rsync
    environment:
      - TZ=${TZ}
      - SSH_USERS=${DMZ_USR}:${DMZ_UID}:${DMZ_GID}
      # Hardened: SSH keys only, root login disabled
      - SSH_ENABLE_PASSWORD_AUTH=false
      - SSH_ENABLE_ROOT=false
      - SFTP_MODE=false
    volumes:
      # 1. Host SSH keys (preserves host fingerprint across container recreations)
      - ./appdata/${DMZ_USR}_ssh_config/keys:/etc/ssh/keys
      # Mount hardened sshd_config
      - ./appdata/${DMZ_USR}_ssh_config/config/sshd_config:/etc/ssh/sshd_config
      # 2. Authorized public keys
      # Dedicated key file mapped per user
      - ./appdata/${DMZ_USR}_ssh_config/id_ed25519.pub:/etc/authorized_keys/${DMZ_USR}
      # 3. Chrooted backup jail on HDD
      # Home on backup_01 HDD
      - ${BACKUP_01}/${DMZ_USR}-container:/home/${DMZ_USR}
      # 4. Timezone synchronization
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DMZ_PPORT}:22"
    restart: always
    networks:
      dmz_net:
        ipv4_address: ${NET_DMZ_NET}2

  # ==========================================
  # 8d. ERP & CRM (Dolibarr)
  # ==========================================
  dolibarr:
    image: dolibarr/dolibarr:latest
    #profiles: ["disable"] # Uncomment to disable service
    container_name: dolibarr
    extra_hosts:
      - "erp.${DOMAIN_2}:${NET_WEB_NET}2"
    environment:
      - TZ=${TZ}
      # Database configuration
      - DOLI_DB_HOST=db
      - DOLI_DB_NAME=dolibarr
      - DOLI_DB_USER=${DOLI_DB_USER}
      - DOLI_DB_PASSWORD=${DOLI_DB_PASSWORD}
      # Initial setup
      #- DOLI_ADMIN_LOGIN=admin
      #- DOLI_ADMIN_PASSWORD=first_password  # Change default admin password immediately upon first login
      - DOLI_URL_ROOT=https://erp.${DOMAIN_2}
      # PHP runtime limits for invoice/document handling
      - PHP_INI_MEMORY_LIMIT=512M
      - PHP_INI_UPLOAD_MAX_FILESIZE=100M
      - PHP_INI_POST_MAX_SIZE=100M
    volumes:
      # Generated invoices and documents stored on SATA HDD
      - ${BACKUP_02}/dolibarr/documents:/var/www/documents
      # Custom plugins stored on NVMe SSD
      - ./appdata/dolibarr/custom:/var/www/html/custom
      # Timezone synchronization
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/dolibarr/conf:/var/www/html/conf
    networks:
      web_net:
        ipv4_address: ${NET_WEB_NET}31
    restart: always
    depends_on:
      db:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Domain routing rule
      - "traefik.http.routers.dolibarr.rule=Host(`erp.${DOMAIN_2}`)"
      - "traefik.http.routers.dolibarr.entrypoints=websecure"
      - "traefik.http.routers.dolibarr.tls.certresolver=cloudflare"
      # Protected by CrowdSec bouncer and Authelia 2FA
      - "traefik.http.routers.dolibarr.middlewares=crowdsec-check@file,authelia-${MW_NAME_2}"
      # - "traefik.http.middlewares.lan-only.ipallowlist.sourcerange=127.0.0.1/32,${NET_LOCAL}0/24,${NET_WEB_NET}0/16"
      # - "traefik.http.routers.dolibarr.middlewares=lan-only@docker"
      # Internal port (Dolibarr listens on port 80)
      - "traefik.http.services.dolibarr.loadbalancer.server.port=80"

  # ==========================================
  # 8e. DIUN (Docker Image Update Notifier)
  # ==========================================

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/etc/localtime:/etc/localtime:ro"
      - "./appdata/diun:/data"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - LOG_JSON=false
      #- LOG_LEVEL=debug

      # Outbound notification SMTP settings
      - DIUN_NOTIF_MAIL_HOST=${DIUN_NOTIF_MAIL_HOST}
      - DIUN_NOTIF_MAIL_PORT=${DIUN_NOTIF_MAIL_PORT}
      - DIUN_NOTIF_MAIL_SSL=false
      - DIUN_NOTIF_MAIL_USERNAME=${EMAIL}
      - DIUN_NOTIF_MAIL_PASSWORD=${DIUN_NOTIF_MAIL_PASSWORD}
      # -----------------------
      - DIUN_NOTIF_MAIL_FROM=${EMAIL}
      - DIUN_NOTIF_MAIL_TO=${EMAIL}
      - DIUN_WATCH_SCHEDULE=0 0 * * *

      # Docker image watch settings
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    networks:
      trash_net:
        ipv4_address: ${NET_TRASH_NET}2
    restart: always

  # ==========================================
  # 8f. AI SDR SYSTEM (n8n & AI Agents)
  # ==========================================
  n8n_sdr:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_sdr
    restart: always
    environment:
      # Container timezone synced with host for consistent logging
      - TZ=${TZ}
      # Internal application schedule aligned with European business hours
      - GENERIC_TIMEZONE=Europe/Rome

      # Node.js heap limit increased to 1GB to prevent OOM errors on heavy workflows
      - NODE_OPTIONS=--max-old-space-size=1024

      # ==========================================
      # NETWORK IDENTITY (v2.x syntax)
      # ==========================================
      - N8N_HOST=sdr.${DOMAIN_1}
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://sdr.${DOMAIN_1}

      # Automated pruning to keep the internal SQLite database lean
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168

      # Trust 2 reverse proxy hops (Cloudflare edge + local Traefik)
      - N8N_PROXY_HOPS=2
      # --- RESOURCE TUNING & COMMUNITY NODE SUPPORT ---
      # Enable community node package installations
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      # Lower task timeout to free memory earlier if an upstream API hangs
      #- N8N_RUNNERS_TASK_TIMEOUT=60
      # Max ZIP decompression size: 256MB (mitigates memory exhaustion from zip-bombs)
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      # Max files per archive: 1000 files
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000

    # Isolated container network routing through Traefik reverse proxy
    networks:
      sdr_net:
        ipv4_address: ${NET_SDR_NET}10
      web_net:
        ipv4_address: ${NET_WEB_NET}80
    volumes:
      # Persistent workflow data included in automated Restic/Backrest snapshots
      - ./appdata/n8n_sdr:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

      # Unified routing for web UI and incoming webhooks
      - "traefik.http.routers.n8n.rule=Host(`sdr.${DOMAIN_1}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=cloudflare"

      # Protected by CrowdSec bouncer against brute-force and bot traffic
      - "traefik.http.routers.n8n.middlewares=crowdsec-check@file"

##### --------------------------------------------------------------------- ######

networks:
  web_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_WEB_NET}0/16
          gateway: ${NET_WEB_NET}1
  sdr_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_SDR_NET}0/16
          gateway: ${NET_SDR_NET}1

  # --- Isolated DMZ network for external backup targets ---
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_DMZ_NET}0/16
          gateway: ${NET_DMZ_NET}1

  trash_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_TRASH_NET}0/16
          gateway: ${NET_TRASH_NET}1
