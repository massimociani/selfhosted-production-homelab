    volumes:
      - ./appdata/web/${MW_SUBNAME_NK1a}.${DOMAIN_NK1}/wp-content:/var/www/html/wp-content
      - ./appdata/web/${MW_SUBNAME_NK1a}.${DOMAIN_NK1}/wp-config.php:/var/www/html/wp-config.php
      - ./appdata/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
